<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Dev Crew - เข้าสู่ระบบ</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #1c1f24; }
  form { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 24px; width: min(360px, calc(100vw - 32px)); box-sizing: border-box; }
  h1 { font-size: 1.2rem; margin: 0 0 16px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #c9ced6; border-radius: 6px; }
  button { margin-top: 14px; width: 100%; padding: 10px; font-size: 1rem; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { margin-top: 12px; min-height: 1.2em; font-size: 0.9rem; color: #b42318; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e6e8ec; }
    form { background: #1d2025; border-color: #2c3038; }
    input { background: #14161a; color: #e6e8ec; border-color: #3a404a; }
  }
</style>
</head>
<body>
<form id="login-form" autocomplete="off">
  <h1>Auto Dev Crew</h1>
  <label for="password">รหัสผ่าน</label>
  <input id="password" name="password" type="password" required autofocus>
  <button id="submit" type="submit">เข้าสู่ระบบ</button>
  <div id="msg" role="alert"></div>
</form>
<script>
(function () {
  var form = document.getElementById("login-form");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("submit");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, data: d }; });
      })
      .then(function (res) {
        if (res.status === 200) { window.location.replace("/"); return; }
        msg.textContent = (res.data && res.data.error) || "เข้าสู่ระบบไม่สำเร็จ";
        btn.disabled = false;
      })
      .catch(function () {
        msg.textContent = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
        btn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
