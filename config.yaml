# Generic template config (clean copy). Fill in your own owner, repos and enable engines.
# API keys are read from .env (see .env.example); never put key values here.
owner: example-owner
parallel:
  enabled: true
  slots: 3
  reserve_for_issues: 1
  poll_interval_seconds: 120
  merge_lock_timeout_minutes: 25
  assignments:
    slot_2:
      persona: null
      repo: null
    slot_3:
      persona: null
      repo: null
  active_slot: null
evaluation:
  enabled: true
  engine: auto
  timeout_minutes: 5
  rubric:
    alignment_weight: 0.4
    safety_cleanliness_weight: 0.3
    quality_weight: 0.3
  min_pass_score: 0.75
  max_eval_refinements: 2
  convergence_check: true
triage:
  enabled: true
  use_llm_fallback: false
  fast_labels:
  - quick-fix
  - typo
  - docs
  - documentation
  - minor
  - small
  - lint
  heavy_labels:
  - feature
  - architecture
  - refactor
  - breaking
  - complex
  - security
ci:
  enabled: true
  required_checks: []
  timeout_minutes: 15
  poll_interval_seconds: 15
  auto_rebase: true
  allow_no_ci: true
  auto_bootstrap_ci: false
engine_timeout_cooldown_minutes: 20
engines:
- name: pollinations-luna
  auth_provider: pollinations
  path: ~/.opencode-bin/opencode.exe
  provider: Pollinations.ai (OpenAI Compatible)
  command: opencode
  model: pollinations/openai/gpt-6-luna
  timeout_minutes: 30
  trains_on_data: false
  enabled: false
  roles:
  - coder
  - scan
  api_keys:
  - ${POLLINATIONS_API_KEY_1}
- name: nvidia-nemotron
  auth_provider: nvidia
  path: ~/.opencode-bin/opencode.exe
  provider: NVIDIA build
  command: opencode
  model: nvidia/nvidia/nemotron-3-ultra-550b-a55b
  timeout_minutes: 45
  trains_on_data: false
  enabled: false
  api_keys:
  - ${NVIDIA_API_KEY_1}
- name: pollinations-glyph
  auth_provider: pollinations-glyph
  path: ~/.opencode-bin/opencode.exe
  provider: Pollinations.ai
  command: opencode
  model: pollinations/stealth/glyph-cluster
  timeout_minutes: 30
  trains_on_data: false
  enabled: false
  roles:
  - coder
  api_keys:
  - ${POLLINATIONS_API_KEY_1}
- name: pollinations-deepseek
  auth_provider: pollinations-deepseek
  path: ~/.opencode-bin/opencode.exe
  provider: Pollinations.ai (DeepSeek, judge)
  command: opencode
  model: pollinations/deepseek/deepseek-v4.1-flash
  timeout_minutes: 30
  trains_on_data: false
  enabled: false
  roles:
  - judge
  api_keys:
  - ${POLLINATIONS_API_KEY_1}
- name: agy-ai-pro
  provider: Google AI Pro
  command: agy
  path: ~/.gemini/bin/agy.exe
  model: gemini-3.8-flash-high
  timeout_minutes: 30
  trains_on_data: false
  enabled: false
- name: opencode-pollinations
  provider: Pollinations
  command: opencode
  model: pollinations/openai/gpt-6-luna
  timeout_minutes: 30
  trains_on_data: false
  enabled: true
  api_keys:
  - ${POLLINATIONS_API_KEY_1}
  provider_id: pollinations
merge_mode: review-all
max_fix_attempts: 3
small_pr:
  max_lines: 50
  protected_paths:
  - .github/
  - requirements
  - .jules/quality
  - config
labels:
  task: ai-task
  pause: ai-pause
  working: ai-working
  failed: ai-failed
  pr: ai-generated
personas:
  enabled:
  - bolt
  - sentinel
  - palette
  - quality
  skills:
    bolt:
    - memory-leak-debugging
    - caveman-persona
    sentinel:
    - security-audit
    - caveman-persona
    palette:
    - a11y-debugging
    - caveman-persona
    quality:
    - improve-codebase-architecture
    - caveman-persona
repos: []
autonomous:
  max_turns_per_session: 40
todo_scan:
  max_issues_per_run: 5
  schedule_minutes: 0
auto_issue:
  enabled: false
  trigger: after_scan
  min_severity: low
